name: CI

on:
  push:
    branches: [ "series/3.x" ]
  pull_request:
    branches: [ "series/3.x" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      matrix:
        scala: [ "2.13.18", "3.3.7" ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "sbt"
      - uses: sbt/setup-sbt@v1

      - name: Build and test
        run: sbt "++ ${{ matrix.scala }}; test"
